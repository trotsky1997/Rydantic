name: CI

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Rust / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      RUSTUP_TOOLCHAIN: 1.98.1
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the tested Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test models, schema parity, compile diagnostics and documentation
        run: cargo test --workspace --all-features --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Check runtime without derive or dynamic features
        run: cargo check -p rydantic --no-default-features --lib --locked
      - name: Check optional runtime features without derive
        run: cargo check -p rydantic --no-default-features --features chrono,decimal --lib --locked
      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps --locked
      - name: Run the tool and renamed dependency examples
        run: |
          cargo run --locked --quiet -p rydantic --example tool_call
          cargo run --locked --quiet -p rydantic --example tool_call -- '{"kind":"ping"}'
          cargo run --locked --quiet -p rydantic-renamed-fixture
          cargo run --locked --quiet -p rydantic --example borrowed
          cargo run --locked --quiet -p rydantic --example streaming
          cargo run --locked --quiet -p rydantic --example asynchronous
          cargo run --locked --quiet -p rydantic --example dates_decimal --features chrono,decimal
