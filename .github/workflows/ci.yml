name: CI

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pi-bridge:
    name: Local Responses development bridge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: crates/rydantic-ai/bridge/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: crates/rydantic-ai/bridge
      - run: npm test
        working-directory: crates/rydantic-ai/bridge

  release-checks:
    name: Release safety checks
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: 1.98.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.98.1 --profile minimal
      - run: python3 -m unittest discover -s scripts -p 'test_release*.py' -v
      - name: Check agent toolkit packaging and evaluation harness
        run: |
          python3 -m unittest discover -s scripts -p 'test_agent_toolkit.py' -v
          python3 -m unittest discover -s evals/rydantic-agent/tests -p 'test_*.py' -v

  test:
    name: Rust / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      RUSTUP_TOOLCHAIN: 1.98.1
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the tested Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - name: Install Cap'n Proto compiler (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y capnproto
      - name: Install Cap'n Proto compiler (macOS)
        if: runner.os == 'macOS'
        run: brew install capnp
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test models, schema parity, compile diagnostics and documentation
        run: cargo test --workspace --all-features --locked
      - name: Test automatic schema without consumer feature
        run: cargo test -p rydantic-auto-capnp-fixture --lib --locked
      - name: Test direct proc macros without runtime derive re-exports
        run: |
          cargo test -p rydantic-direct-capnp-fixture --lib --locked
          cargo test -p rydantic-direct-capnp-fixture --lib --features cfg-fixture --locked
      - name: Verify exact stable agent Skill consumers
        run: |
          cargo test --manifest-path skills/rydantic/assets/stable-0.6.0/Cargo.toml --locked
          cargo test --manifest-path skills/rydantic/assets/stable-0.7.0/Cargo.toml --locked
      - name: Verify exact-source agent Skill consumer
        run: cargo test --manifest-path skills/rydantic/assets/source-6006720/Cargo.toml --locked
      - name: Verify exact-source evaluation harness controls
        run: |
          cargo fetch --manifest-path evals/rydantic-agent/packs/source-60067205276e314653f46a75c213ec1756c7ad7c/tasks/source-context-policy/Cargo.toml --locked
          python3 evals/rydantic-agent/tests/smoke_source_context.py --cargo "$(rustup which --toolchain 1.98.1 cargo)" --rustc "$(rustup which --toolchain 1.98.1 rustc)"
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Verify all gateway protocols with official Python SDKs
        if: runner.os == 'Linux'
        run: |
          cargo build -p rydantic-ai --bin rydantic-ai-gateway --locked
          python3 -m venv "$RUNNER_TEMP/rydantic-gateway-sdks"
          "$RUNNER_TEMP/rydantic-gateway-sdks/bin/pip" install --disable-pip-version-check -r scripts/gateway_sdk_requirements.txt
          "$RUNNER_TEMP/rydantic-gateway-sdks/bin/python" scripts/check_gateway_sdks.py
      - name: Verify official Cap'n Proto CLI interoperability
        if: runner.os == 'Linux'
        run: cargo test --locked -p rydantic-capnp-fixture --test native -- --ignored
      - name: Check runtime without derive or dynamic features
        run: cargo check -p rydantic --no-default-features --lib --locked
      - name: Check AI agents and graphs without HTTP dependencies
        run: cargo test -p rydantic-ai --no-default-features --locked
      - name: Check OpenAPI components without derive
        run: cargo check -p rydantic --no-default-features --features openapi --lib --locked
      - name: Check settings without derive
        run: cargo check -p rydantic --no-default-features --features settings --lib --locked
      - name: Check optional runtime features without derive
        run: cargo check -p rydantic --no-default-features --features chrono,decimal,capnp --lib --locked
      - name: Check partial JSON without derive
        run: cargo check -p rydantic --no-default-features --features partial-json --lib --locked
      - name: Check domain features independently without derive
        run: |
          cargo check -p rydantic --no-default-features --features phone --lib --locked
          cargo check -p rydantic --no-default-features --features country --lib --locked
          cargo check -p rydantic --no-default-features --features currency --lib --locked
      - name: Check framework integrations without derive
        run: cargo check -p rydantic --no-default-features --features axum,sqlite --lib --locked
      - name: Check driver-free SQL metadata and SQLite runtime
        run: |
          cargo check -p rydantic --no-default-features --features sqlx --lib --locked
          cargo check -p rydantic --no-default-features --features sqlite --lib --locked
      - name: Check individual server database features without derive
        run: |
          cargo check -p rydantic --no-default-features --features postgres --lib --locked
          cargo check -p rydantic --no-default-features --features mysql --lib --locked
      - name: Compile HTTP servers with one database driver
        run: |
          cargo check -p rydantic --no-default-features --features derive,axum,postgres --example database_api --locked
          cargo check -p rydantic --no-default-features --features derive,axum,mysql --example database_api --locked
      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps --locked
      - name: Run tutorial examples without model credentials
        run: |
          cargo run --locked --quiet -p rydantic --example openapi_components --features openapi
          cargo run --locked --quiet -p rydantic --example data_contract
          cargo run --locked --quiet -p rydantic-ai --no-default-features --example typed_agent
          cargo run --locked --quiet -p rydantic-ai --no-default-features --example structured
          cargo run --locked --quiet -p rydantic-ai --no-default-features --example graph
      - name: Run the tool and renamed dependency examples
        run: |
          cargo run --locked --quiet -p rydantic --example tool_call
          cargo run --locked --quiet -p rydantic --example tool_call -- '{"kind":"ping"}'
          cargo run --locked --quiet -p rydantic-renamed-fixture
          cargo run --locked --quiet -p rydantic --example borrowed
          cargo run --locked --quiet -p rydantic --example streaming
          cargo run --locked --quiet -p rydantic --example asynchronous
          cargo run --locked --quiet -p rydantic --example dates_decimal --features chrono,decimal
          cargo run --locked --quiet -p rydantic-capnp-fixture
          cargo run --locked --quiet -p rydantic-auto-capnp-fixture
          cargo run --locked --quiet -p rydantic --example auto_capnp --features capnp
          cargo run --locked --quiet -p rydantic --example sqlite_api --features axum,sqlite -- --smoke
          cargo run --locked --quiet -p rydantic --example database_api --features axum,sqlite -- --smoke
          cargo run --locked --quiet -p rydantic --example automatic_migrations --features sqlite

  compiler-paths-windows:
    name: Compiler paths / Windows
    runs-on: windows-latest
    env:
      RUSTUP_TOOLCHAIN: 1.98.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the tested Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Test compiler path resolution
        run: cargo test -p rydantic-derive --features capnp --locked compiler_paths

  databases:
    name: PostgreSQL 18 and MySQL 8.4
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: rydantic
          POSTGRES_PASSWORD: rydantic_test
          POSTGRES_DB: rydantic_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rydantic -d rydantic_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: rydantic_root_test
          MYSQL_USER: rydantic
          MYSQL_PASSWORD: rydantic_test
          MYSQL_DATABASE: rydantic_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      RUSTUP_TOOLCHAIN: 1.98.1
      CARGO_TERM_COLOR: always
      RYDANTIC_POSTGRES_URL: postgres://rydantic:rydantic_test@127.0.0.1:5432/rydantic_test
      RYDANTIC_MYSQL_URL: mysql://rydantic:rydantic_test@127.0.0.1:3306/rydantic_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the tested Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Test native SQL drivers, transactions and real HTTP routes
        run: cargo test -p rydantic --all-features --test server_databases --locked -- --include-ignored
      - name: Test automatic model migrations on real server databases
        run: cargo test -p rydantic --all-features --test migrations --locked -- --include-ignored
