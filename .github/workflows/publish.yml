name: Publish crates

"on":
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tested release tag (vX.Y.Z or vX.Y.Z-beta.N)"
        required: true
        type: string

permissions: {}

concurrency:
  group: crates-io-publish
  cancel-in-progress: false

jobs:
  preflight:
    if: github.repository == 'trotsky1997/Rydantic' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.check.outputs.sha }}
    defaults:
      run:
        working-directory: source
    steps:
      - name: Check out reviewed release tooling at the immutable dispatch commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: release-tools
          sparse-checkout: scripts
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Reject untrusted refs before running repository scripts
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python3 - <<'PYTAG'
          import os, re, subprocess
          tag = os.environ["RELEASE_TAG"]
          if not re.fullmatch(r"v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-beta\.(0|[1-9][0-9]*))?", tag):
              raise SystemExit("Not a supported release tag")
          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()
          if git("rev-parse", f"refs/tags/{tag}^{{commit}}") != git("rev-parse", "HEAD"):
              raise SystemExit("Release tag does not match checkout")
          subprocess.run(["git", "merge-base", "--is-ancestor", "HEAD", "origin/main"], check=True)
          PYTAG
      - name: Verify tag, exact dependency pin, CI and unpublished versions
        id: check
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: python3 "$GITHUB_WORKSPACE/release-tools/scripts/release.py" preflight --tag "$RELEASE_TAG"

  publish:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    env:
      RUSTUP_TOOLCHAIN: 1.98.1
      RELEASE_TAG: ${{ inputs.tag }}
      CARGO_TERM_COLOR: always
    defaults:
      run:
        working-directory: source
    steps:
      - name: Check out reviewed release tooling at the immutable dispatch commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: release-tools
          sparse-checkout: scripts
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
          ref: ${{ needs.preflight.outputs.sha }}
          persist-credentials: false
      - name: Install the tested Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Verify derive package before obtaining credentials
        run: cargo publish --locked --dry-run -p rydantic-derive
      - name: Obtain short-lived publishing credential
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish derive once and verify registry and index
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: python3 "$GITHUB_WORKSPACE/release-tools/scripts/release.py" publish --tag "$RELEASE_TAG" --crate rydantic-derive
      - name: Validate and publish runtime once, then verify
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: python3 "$GITHUB_WORKSPACE/release-tools/scripts/release.py" publish --tag "$RELEASE_TAG" --crate rydantic
