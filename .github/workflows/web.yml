name: Documentation and homepage

on:
  pull_request:
    paths:
      [
        "docs/**",
        "crates/rydantic/examples/**",
        "crates/rydantic-ai/examples/**",
        "website/**",
        "scripts/**",
        "package*.json",
        "Cargo.toml",
        ".github/workflows/web.yml",
      ]
  push:
    branches: [main]
    paths:
      [
        "docs/**",
        "crates/rydantic/examples/**",
        "crates/rydantic-ai/examples/**",
        "website/**",
        "scripts/**",
        "package*.json",
        "Cargo.toml",
        ".github/workflows/web.yml",
      ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Validate docs and build homepage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node --check website/app.js
      - run: npm run site:build
      - run: npm run check
      - run: npm run docs:check
      - uses: actions/upload-pages-artifact@5f327015a708106f6f1b7c9a633901af30fe80cb
        if: github.event_name != 'pull_request'
        with:
          path: .site

  deploy:
    name: Publish GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - name: Deploy homepage
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
