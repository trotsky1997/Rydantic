[workspace]
members = ["crates/rydantic", "crates/rydantic-derive", "crates/rydantic-ai", "crates/rydantic-codegen", "crates/rydantic-cli", "fixtures/renamed", "fixtures/capnp", "fixtures/auto-capnp", "fixtures/direct-capnp"]
exclude = ["examples/forum"]
resolver = "2"

[workspace.package]
version = "0.8.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/trotsky1997/Rydantic"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value", "arbitrary_precision"] }
regex = "1"
jsonschema = { version = "0.33", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
