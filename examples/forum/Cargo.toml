[package]
name = "rydantic-forum-example"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
anyhow = { version = "1", optional = true }
argon2 = { version = "0.5", optional = true }
axum = { version = "0.8.9", optional = true }
dioxus = { version = "0.7.0", features = ["fullstack"] }
rydantic = { path = "../../crates/rydantic", default-features = false, features = ["derive"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.10", optional = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"], optional = true }
uuid = { version = "1", features = ["v4"], optional = true }

[features]
default = []
web = ["dioxus/web"]
server = [
    "dioxus/server",
    "dep:anyhow",
    "dep:argon2",
    "dep:axum",
    "dep:rydantic",
    "rydantic/sqlite",
    "dep:sha2",
    "dep:tokio",
    "dep:uuid",
]
