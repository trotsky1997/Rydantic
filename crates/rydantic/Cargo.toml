[package]
name = "rydantic"
description = "Type-driven models, validation, JSON Schema and native Cap'n Proto for Rust"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://github.com/trotsky1997/Rydantic"
documentation = "https://docs.rs/rydantic"
readme = "../../README.md"
keywords = ["validation", "serde", "json-schema", "capnp", "pydantic"]
categories = ["data-structures", "encoding", "parsing"]

[package.metadata.docs.rs]
all-features = true

[features]
default = ["derive"]
derive = ["dep:rydantic-derive"]
dynamic = ["dep:jsonschema"]
chrono = ["dep:chrono"]
decimal = ["dep:rust_decimal"]
capnp = ["dep:capnp", "rydantic-derive?/capnp"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
regex.workspace = true
email_address = "0.2"
rydantic-derive = { version = "0.3.1", path = "../rydantic-derive", optional = true }
jsonschema = { workspace = true, optional = true }

chrono = { version = "0.4", default-features = false, features = ["std"], optional = true }
rust_decimal = { version = "1", default-features = false, features = ["std"], optional = true }

capnp = { version = "0.27", features = ["unaligned"], optional = true }

[dev-dependencies]
jsonschema.workspace = true
trybuild = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[lints]
workspace = true

[[example]]
name = "dates_decimal"
required-features = ["chrono", "decimal"]

[[example]]
name = "auto_capnp"
required-features = ["derive", "capnp"]
