[package]
name = "rydantic"
description = "Type-driven validation, JSON Schema, Cap'n Proto, Axum and SQLx models for Rust"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://github.com/trotsky1997/Rydantic"
documentation = "https://docs.rs/rydantic"
readme = "../../README.md"
keywords = ["validation", "serde", "json-schema", "capnp", "pydantic"]
categories = ["data-structures", "encoding", "parsing"]

[package.metadata.docs.rs]
all-features = true

[features]
default = ["derive"]
derive = ["dep:rydantic-derive"]
dynamic = ["dep:jsonschema"]
chrono = ["dep:chrono"]
decimal = ["dep:rust_decimal"]
capnp = ["dep:capnp", "rydantic-derive?/capnp"]
axum = ["dep:axum"]
sqlx = ["dep:sqlx"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
regex.workspace = true
email_address = "0.2"
rydantic-derive = { version = "0.4.0", path = "../rydantic-derive", optional = true }
jsonschema = { workspace = true, optional = true }

chrono = { version = "0.4", default-features = false, features = ["std"], optional = true }
rust_decimal = { version = "1", default-features = false, features = ["std"], optional = true }

capnp = { version = "0.27", features = ["unaligned"], optional = true }
axum = { version = "0.8.9", default-features = false, features = ["json", "tokio", "http1"], optional = true }
sqlx = { version = "0.9", default-features = false, features = ["sqlite-bundled", "runtime-tokio"], optional = true }

[dev-dependencies]
jsonschema.workspace = true
trybuild = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "net", "io-util"] }
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true

[[example]]
name = "dates_decimal"
required-features = ["chrono", "decimal"]

[[example]]
name = "auto_capnp"
required-features = ["derive", "capnp"]

[[example]]
name = "sqlite_api"
required-features = ["derive", "axum", "sqlx"]
