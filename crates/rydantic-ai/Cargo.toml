[package]
name = "rydantic-ai"
version = "0.7.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Typed AI agents, resumable graphs and a multi-protocol gateway for Rydantic"
documentation = "https://docs.rs/rydantic-ai"
homepage = "https://rydantic.mintlify.site/integrations/ai"
readme = "README.md"
keywords = ["agent", "llm", "validation", "workflow", "gateway"]
categories = ["api-bindings", "asynchronous"]
include = ["/src/**", "/tests/**", "/examples/**", "/README.md", "/LICENSE", "/Cargo.toml"]

[features]
default = ["http"]
http = ["dep:reqwest", "dep:axum", "dep:futures-util", "dep:tokio-stream", "dep:tracing-subscriber", "dep:sha2"]

[dependencies]
rydantic = { version = "=0.8.0", path = "../rydantic", features = ["partial-json"] }
serde.workspace = true
serde_json.workspace = true
base64 = "0.22"
url = "2"
sha2 = { version = "0.10", optional = true }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "net", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls", "stream"], optional = true }
axum = { version = "0.8.9", optional = true }
futures-util = { version = "0.3", optional = true }
tokio-stream = { version = "0.1", optional = true }

[lints]
workspace = true

[[bin]]
name = "rydantic-ai-gateway"
path = "src/bin/gateway.rs"
required-features = ["http"]

[[example]]
name = "provider"
required-features = ["http"]

[[example]]
name = "jev"
required-features = ["http"]

[[example]]
name = "vision"
required-features = ["http"]

[[example]]
name = "pdf"
required-features = ["http"]
