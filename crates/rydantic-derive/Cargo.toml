[package]
name = "rydantic-derive"
description = "Derive macros for Rydantic"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://github.com/trotsky1997/Rydantic"
documentation = "https://docs.rs/rydantic"
readme = "README.md"
keywords = ["derive", "validation", "pydantic"]
categories = ["development-tools::procedural-macro-helpers"]

[lib]
proc-macro = true

[features]
capnp = ["dep:capnpc", "dep:tempfile", "dep:sha2"]

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "extra-traits", "visit-mut"] }
proc-macro-crate = "3"
heck = "0.5"
regex.workspace = true
serde_json.workspace = true
capnpc = { version = "0.27", optional = true }
tempfile = { version = "3", optional = true }
sha2 = { version = "0.10", optional = true }

[lints]
workspace = true
