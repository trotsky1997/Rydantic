[package]
name = "rydantic-derive"
description = "Derive macros for Rydantic"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://github.com/trotsky1997/Rydantic"
documentation = "https://docs.rs/rydantic"
readme = "README.md"
keywords = ["derive", "validation", "pydantic"]
categories = ["development-tools::procedural-macro-helpers"]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "extra-traits"] }
proc-macro-crate = "3"
heck = "0.5"
regex.workspace = true
serde_json.workspace = true

[lints]
workspace = true
