[package]
name = "rydantic-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = ["crates-io"]
repository.workspace = true
description = "Offline, exact-version Rydantic discovery and explanations for coding agents"
readme = "README.md"
include = ["src/**", "knowledge/*.json", "tests/**", "protocol-v1.schema.json", "README.md", "DISTRIBUTION.md", "LICENSE"]

[[bin]]
name = "rydantic"
path = "src/main.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
toml = "1.1"
semver = "1"

[lints]
workspace = true
